<body>
<div class="app">
  <header class="mast">
    <div class="title-row">
      <div class="brand"><div class="eyebrow">Carter · Kessel · Pellum family archive</div><h1>Interactive Family Tree</h1></div>
      <div class="zoom-controls top-zoom" aria-label="Tree zoom controls">
        <button id="zoomOut" class="zoom-btn" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="zoomReset" class="zoom-btn zoom-level" title="Reset zoom" aria-label="Reset zoom"><span id="zoomLabel">100%</span></button>
        <button id="zoomIn" class="zoom-btn" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zoomFit" class="zoom-btn" title="Show the full family map" aria-label="Show the full family map">Fit</button>
      </div>
      <div class="header-actions">
        <div class="stats"><span class="stat source-stat" id="sourceStat"></span><button id="peopleBtn" class="tool-btn people-btn" aria-expanded="false" aria-controls="peopleSection">People · <span id="peopleStat"></span></button></div>
        <nav class="top-nav" aria-label="Family tree navigation">
          <button id="fullMapBtn" class="tool-btn full-map-btn" title="Zoom out to the complete family map">Full map</button>
          <button id="rootBtn" class="tool-btn">Michelle</button>
          <button id="backBtn" class="tool-btn">← Back</button>
        </nav>
      </div>
    </div>
  </header>
  <div class="layout">
    <main class="main">
      <section id="network" class="network" aria-label="Clickable family relationship tree">
        <div id="crumbs" class="crumbs"></div>
        <div id="treeCanvas" class="tree-canvas">
          <svg id="connectors" class="connectors"></svg>
          <div id="globalNodes" class="global-nodes"></div>
        </div>
        <div class="status-legend" aria-label="Color and relationship legend"><span class="historical-key">Major historical event</span><span class="verified-key">Verified</span><span class="probable-key">Probable</span><span class="possible-key">Possible</span><span class="edge-key">Parent/child</span><span class="spouse-key">Parent pair / partner</span><span class="sibling-key">Sibling</span></div>
        <div id="hoverCard" class="hover-card" role="tooltip" aria-hidden="true"></div>

function renderDetails(p){
 const fact=(label,value)=>value?`<dt>${esc(label)}</dt><dd>${esc(value)}</dd>`:'';

 const sources=p.sources?.length?`<div class="detail-section"><h3>Sources (${esc(p.sourceCount)} reported)</h3><div class="source-list">${p.sources.map(s=>s.url?`<a class="source" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}<small>${esc(s.type||'Source link')}</small></a>`:`<div class="source">${esc(s.title)}</div>`).join('')}</div></div>`:'';
 $('details').innerHTML=`<button id="closeDetails" class="details-close" aria-label="Close person details" title="Close details">×</button><div class="eyebrow">Person record · ${esc(p.id)}</div><h2>${esc(p.name)}</h2><div>${esc(years(p))}</div><div class="badges"><span class="badge">${esc(p.branch)}</span>${p.living?'<span class="badge living">Living / possibly living</span>':'<span class="badge">Deceased</span>'}<span class="badge conf">${esc(p.confidence)}</span></div><dl class="facts">${fact('Gender',p.gender)}${fact('City',p.city)}${fact('Born',[p.birthDate,p.birthPlace].filter(Boolean).join(' · '))}${fact('Died',[p.deathDate,p.deathPlace].filter(Boolean).join(' · '))}${fact('Burial',p.burialPlace)}${fact('Age',p.ageAtDeath)}${fact('Origin',p.dataOrigin)}</dl>${aliases}${notes}${relButtons(p.parents,'Parents')}${relButtons(p.spouses,'Spouses / partners')}${relButtons(p.children,'Children')}${relButtons(p.siblings,'Siblings')}${relButtons(p.stepSiblings,'Step-siblings')}${timeline}${sources}`;

function renderIndex(){

}
function drawLines(){

function parentFamilies(parentIds){const ids=[...new Set(parentIds)].filter(id=>people[id]);if(ids.length<=2)return ids.length?[ids]:[];const unused=new Set(ids),families=[];ids.forEach(a=>{if(!unused.has(a))return;const partner=ids.find(b=>b!==a&&unused.has(b)&&(person(a).spouses.includes(b)||person(b).spouses.includes(a)));if(partner){families.push([a,partner].sort());unused.delete(a);unused.delete(partner)}});unused.forEach(id=>families.push([id]));return families}
function lineageParents(id,rootId){const ids=person(id).parents;if(id===rootId||ids.length<=2)return ids;return parentFamilies(ids)[0]||ids.slice(0,2)}
function familyUnitsForRow(list,rootId){
 const rowSet=new Set(list),adj=new Map(list.map(id=>[id,new Set()])),connect=(a,b)=>{if(a!==b&&rowSet.has(a)&&rowSet.has(b)){adj.get(a).add(b);adj.get(b).add(a)}};

function buildFocusLayout(rootId){

 $('details').innerHTML=`<button id="closeDetails" class="details-close" aria-label="Close person details" title="Close details">×</button><div class="eyebrow">Person record · ${esc(p.id)}</div><h2>${esc(p.name)}</h2><div>${esc(years(p))}</div><div class="badges"><span class="badge">${esc(p.branch)}</span>${p.living?'<span class="badge living">Living / possibly living</span>':'<span class="badge">Deceased</span>'}${p.historicalFigure?'<span class="badge historical">Major historical event</span>':''}</div><dl class="facts">${fact('Evidence',p.verificationReason)}${fact('Gender',p.gender)}${fact('City',p.city)}${fact('Born',[p.birthDate,p.birthPlace].filter(Boolean).join(' · '))}${fact('Died',[p.deathDate,p.deathPlace].filter(Boolean).join(' · '))}${fact('Burial',p.burialPlace)}${fact('Age',p.ageAtDeath)}${fact('Origin',p.dataOrigin)}</dl>${historical}${aliases}${notes}${relButtons(p.parents,'Parents')}${relButtons(p.spouses,'Spouses / partners')}${relButtons(p.children,'Children')}${relButtons(p.siblings,'Siblings')}${relButtons(p.stepSiblings,'Step-siblings')}${timeline}${sources}`;
 $('closeDetails').onclick=closeDetails;bindCards();
}
const branches=['All branches',...new Set(Object.values(people).map(p=>p.branch))];$('branch').innerHTML=branches.sort((a,b)=>a==='All branches'?-1:a.localeCompare(b)).map(b=>`<option>${esc(b)}</option>`).join('');
$('search').oninput=e=>{query=e.target.value;renderIndex()};$('branch').onchange=e=>{branch=e.target.value;renderIndex()};$('peopleBtn').onclick=openPeople;$('treeBtn').onclick=closePeople;$('fullMapBtn').onclick=showFullMap;$('rootBtn').onclick=()=>navigate(DATA.rootId);$('backBtn').onclick=()=>{const id=history.pop();if(id)navigate(id,false)};$('drawerScrim').onclick=closeDetails;document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('peopleSection').classList.contains('open'))closePeople();else if($('details').classList.contains('open'))closeDetails();else hideQuickInfo(true)}});$('zoomOut').onclick=()=>setZoom(treeZoom/1.18);$('zoomIn').onclick=()=>setZoom(treeZoom*1.18);$('zoomReset').onclick=resetScene;$('zoomFit').onclick=showFullMap;
const treeViewport=$('network');treeViewport.addEventListener('wheel',e=>{e.preventDefault();const factor=Math.exp(-e.deltaY*.0014);zoomAt(treeZoom*factor,e.clientX,e.clientY)},{passive:false});treeViewport.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button,.crumbs,.status-legend'))return;isDragging=true;dragX=e.clientX;dragY=e.clientY;dragPanX=panX;dragPanY=panY;treeViewport.classList.add('dragging');treeViewport.setPointerCapture(e.pointerId)});treeViewport.addEventListener('pointermove',e=>{if(!isDragging)return;panX=dragPanX+e.clientX-dragX;panY=dragPanY+e.clientY-dragY;applyScene()});const stopDrag=e=>{if(!isDragging)return;isDragging=false;treeViewport.classList.remove('dragging');try{treeViewport.releasePointerCapture(e.pointerId)}catch(_){}};treeViewport.addEventListener('pointerup',stopDrag);treeViewport.addEventListener('pointercancel',stopDrag);
$('peopleStat').textContent=Object.keys(people).length;$('sourceStat').textContent=`${Object.values(people).reduce((n,p)=>n+(Number(p.sourceCount)||0),0).toLocaleString()} source references`;$('method').textContent=DATA.methodology.text;
buildWholeTree();render();closeDetails();closePeople();const initialHash=decodeURIComponent(window.location.hash.slice(1));if(initialHash==='peopleSection'){requestAnimationFrame(openPeople)}else if(people[initialHash]){current=initialHash;render();requestAnimationFrame(()=>centerOnPerson(initialHash,.78))}else{requestAnimationFrame(()=>centerOnPerson(DATA.rootId,.85))}
</script>
